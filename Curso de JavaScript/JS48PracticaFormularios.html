<!DOCTYPE html> 
<html>
	<head>
		<meta charset="utf-8" />
		<title>Práctica Guiada Formulario</title>
        
        <style>
			html, body{
				background-color:#A30000;
			}
			
			.contenido{
				max-width: 760px;
				margin: 20px 0 100px;
			}
			
			.cont_principal{
				margin:auto;
				width:50%;
			}
			
			.logo{
				letter-spacing: -1px;
				color:#FC6;
				text-shadow: 2px 2px 1px rgba(0, 0, 0, .25);
				font: normal 54px 'ColaborateThinRegular', Arial, sans-serif;	
			}
			
			.principal{
				border-bottom: solid 1px rgba(255, 255, 255, .5);
			}
			
			.principal h1{
				font-size: 32px;
				color: white;
				text-shadow: 1px 1px 1px rgba(0, 0, 0, .75);
				border-bottom: solid 1px rgba(255, 255, 255, .5);
			}
			
			p, li, legend, form{
				font-size: 18px;
				color: white;
				font-family: 'ColaborateThinRegular', Arial, sans-serif;
				line-height: 125%;
				margin-bottom: 10px;
			}
			
			input{
				font-size: 20px;
			}
			
			form .wide{
				font-size: 18px;
				width: 100%
			}
			
			form#order div, form#form_registro div{
				padding-bottom: 10px;
			}
			
			form#order .label, form#form_registro .label{
				display:block;
				clear:left;
				float:left;
				width: 175px;
				text-align: right;
				padding: 7px 15px 0 0;
				font-weight: bold;
			}
			
			form#form_registro .label{
				width: 200px;
			}
			
			form#order select, form#form_registro selec{
				display:inline-block;
				margin-top: 8px;
			}
			
			form#order input[type="radio"], form#form_registro input[type="radio"], form#form_registro input[type="checkbox"]{
				display: inline-block
				margin-top: 10px;
			}
			
			form .indent, #submit{
				margin-left: 215px
			}
			
			form#form_registro .indent label.error{
				margin-left: 0;
			}
        </style>
        
        <script src="Jquery/jquery-1.6.3.min.js"></script>
        <script src="Js/jquery.validate.min.js"></script>
        
		<script>
			$(document).ready(function() {
                $("#form_registro").validate({
					rules:{
						e_mail:{
							required:true,
							email:true
						}
					}, //Cierre de rules
					
					messages:{
						e_mail:{
							required: "Introduce el E-mail",
							email: "El formato es erroneo"
						}
					}//Cierre de messages
				});
            });
        </script>
	</head>

	<body>
    	<div class="cont_principal">
        	<div class="cabecera">
            	<p class="logo">Curso de JavaScript</p>
            </div>
            <div class="contenido">
            	<div class="principal">
                	<h1>Rellenar</h1>
                    <form name="form_registro" id="form_registro">
                    	<div>
                        	<label for="nombre" class="label">Nombre</label>
                            <input name="nombre" type="text" id="nombre" class="required", title="Rellena el Nombre">
                        </div>
                        <div>
                        	<label for="email" class="label">E-mail</label>
                            <input name="e_mail" type="text" id="e_mail">
                        </div>
                        <div>
                        	<label for="password" class="label">Contraseña</label>
                            <input name="password" type="password" id="password">
                        </div>
                        <div>
                        	<label for="confirma" class="label">Confirmar contraseña</label>
                            <input name="confirma" type="password" id="confirma">
                        </div>
                        <div><span class="label">Aficiones</span>
                        	<input name="hobby" type="checkbox" id="comer" value="comer">Comer
                            <input name="hobby" type="checkbox" id="beber" value="beber">
                            <label for="beber">Beber</label>
                            <input name="hobby" type="checkbox" id="dormir" value="dormir">
                            <label for="dormir">Dormir</label>
                        </div>
                        <div>
                        	<label for="fecha" class="label">Fecha de Nacimiento</label>
                            <input name="fecha" type="text" id="fecha" class="date" title="El formato es MM/DD/AAAA">
                        </div>
                        <div>
                        	<label for="planeta" class="label">Planeta</label>
                            <select name="planeta" id="planeta" class="required" title="Elige planeta de nacimiento">
                            	<option value="">--Selecciona uno--</option>
                                <option value="">Tierra</option>
                                <option value="">Mercurio</option>
                                <option value="">Venus</option>
                                <option value="No me suena nada">"No me suena nada"</option>
                            </select>
                        </div>
                        <div>
                        	<label for="comentarios" class="label">Comentarios</label>
                            <textarea name="comentarios" cols="15"	rows="5" id="comentarios"></textarea>
                        </div>
                        <div class="labelBlock">¿DESEAS RECIBIR CORREO BASURA DE NUESTRA PARTE?</div>
                        <div class="indent">
                        	<input type="radio" name="spam" id="yes" value="yes">
                            <label for="si">Si</label>
                            <input type="radio" name="spam" id="por_supuesto" value="por_supuesto">
                            <label for="definitely">Por supuesto</label>
                            <input type="radio" name="spam" id="eleccion" value="eleccion">
                            <label for="eleccion">¿Tengo elección?</label>
                        </div>
                        <div>
                        	<input type="submit" name="submit" id="submit" value="Enviar">
                        </div>
                    </form>
                </div>
            </div>
        	
        </div>
	</body>
</html>
